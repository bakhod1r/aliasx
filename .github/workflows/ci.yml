name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh and test tools (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh zip netcat-openbsd
      - name: Git identity for git tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - name: Run tests under bash and zsh
        run: bash tests/run.sh

  linux-distros:
    name: Tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alpine:3.20
            install: apk add -q bash zsh git python3 openssl zip
          - image: fedora:40
            install: dnf install -y -q zsh git python3 openssl zip findutils procps-ng hostname diffutils
    steps:
      - name: Install shells and tools
        run: ${{ matrix.install }}
      - uses: actions/checkout@v7
      - name: Run tests under bash and zsh
        shell: bash
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tests/run.sh

  services:
    name: Real services (PostgreSQL, Redis, nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run integration tests in a container
        run: tests/integration/run-docker.sh

  e2e:
    name: Install end to end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install into a fresh HOME and use it from new shells
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"; touch "$HOME/.bashrc" "$HOME/.zshrc"
          ./install.sh
          bash -ic 'aliasx version && type mkcd >/dev/null && alias gs' </dev/null
          zsh -ic 'aliasx version && whence -w mkcd && alias gs' </dev/null
          ./install.sh --uninstall
          ! grep -q aliasx "$HOME/.bashrc" "$HOME/.zshrc"

  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck every file
        # One file at a time: shellcheck 0.11 can crash on the combined set.
        run: |
          status=0
          for f in aliasx.sh install.sh setup/*.sh aliases/*.sh optional/*.sh bin/* tests/*.sh tests/integration/*.sh; do
            shellcheck "$f" || status=1
          done
          exit $status

  docs:
    name: Docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate docs and fail on diff
        run: |
          python3 tools/gendocs.py
          git diff --exit-code -- docs || { echo "::error::docs/ is stale. Run: python3 tools/gendocs.py"; exit 1; }
