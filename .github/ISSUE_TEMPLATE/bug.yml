name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command you ran, what you expected, what you got.
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `aliasx doctor`
      render: text
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: OS and terminal
      placeholder: macOS 15 / iTerm2, Ubuntu 24.04 / GNOME Terminal…
